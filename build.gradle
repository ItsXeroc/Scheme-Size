plugins {
    id 'java'
}

version = '1.0.3'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_1_8
}

configurations.matching { it.canBeResolved }.configureEach {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}

base {
    archivesName = 'Scheme-Size'
}

sourceSets {
    main {
        java.srcDirs = ['src/java', 'src/java/api/src', 'src/java/client/src', 'src/java/common/src']
        resources.srcDirs = ['src/resources']
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.xpdustry.com/mindustry" }
    maven { url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven { url "https://jitpack.io" }
}

ext {
    mindustryVersion = project.findProperty('mindustryVersion') ?: 'v158.1'
    gameBuild = project.findProperty('gameBuild') ?: '158'
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['--release', '8'])
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Arc:arcnet:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    compileOnly files("libs/jabel-1.1.0.jar")
    annotationProcessor files("libs/jabel-1.1.0.jar")
}

tasks.register('writeModMeta') {
    def out = file("$buildDir/generated/mod.hjson")
    outputs.file(out)
    inputs.file(file('mod.hjson'))
    inputs.property('gameBuild', gameBuild)
    inputs.property('modVersion', version)
    doLast {
        def text = file('mod.hjson').text
        text = text.replaceAll(/(?m)^minGameVersion:.*$/, "minGameVersion: ${gameBuild}")
        text = text.replaceAll(/(?m)^version:.*$/, "version: ${version}")
        text = text.replaceAll(/Requires Mindustry v\d+\+/, "Requires Mindustry v${gameBuild}+")
        out.parentFile.mkdirs()
        out.text = text
    }
}

tasks.jar {
    dependsOn writeModMeta
    archiveFileName = "${base.archivesName.get()}-v${gameBuild}-Desktop.jar"

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(file("$buildDir/generated")) {
        include 'mod.hjson'
    }
}

tasks.register("jarAndroid") {
    dependsOn tasks.jar

    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists())
            throw new GradleException("No valid Android SDK found.")

        def platformRoot = new File("$sdkRoot/platforms/")
                .listFiles()
                .sort()
                .reverse()
                .find { f -> new File(f, "android.jar").exists() }

        if (!platformRoot)
            throw new GradleException("No android.jar found.")

        def dependencies = (
                configurations.compileClasspath.asList() +
                        configurations.runtimeClasspath.asList() +
                        [new File(platformRoot, "android.jar")]
        ).collect { "--classpath $it.path" }.join(" ")

        def buildToolsDir = new File("$sdkRoot/build-tools/")
                .listFiles()
                .sort()
                .reverse()
                .first()

        def d8 = new File(buildToolsDir, isWindows ? "d8.bat" : "d8").absolutePath
        def desktopJar = "${base.archivesName.get()}-v${gameBuild}-Desktop.jar"
        def androidJar = "${base.archivesName.get()}-v${gameBuild}-Android.jar"

        "$d8 $dependencies --min-api 14 --output ${androidJar} ${desktopJar}"
                .execute(null, new File("build/libs"))
                .waitForProcessOutput(System.out, System.err)
    }
}

tasks.register("deploy", Jar) {
    dependsOn "jarAndroid", "jar"

    archiveFileName = "${base.archivesName.get()}-v${gameBuild}.jar"

    from {
        [
                zipTree("$buildDir/libs/${base.archivesName.get()}-v${gameBuild}-Desktop.jar"),
                zipTree("$buildDir/libs/${base.archivesName.get()}-v${gameBuild}-Android.jar")
        ]
    }

    doLast {
        delete "$buildDir/libs/${base.archivesName.get()}-v${gameBuild}-Desktop.jar"
        delete "$buildDir/libs/${base.archivesName.get()}-v${gameBuild}-Android.jar"
    }
}

def targets = [
        [name: '156', version: 'v156', build: '156'],
        [name: '158', version: 'v158.1', build: '158'],
        [name: '159', version: 'v159', build: '159'],
]

targets.each { t ->
    tasks.register("deploy${t.name}", Exec) {
        group = 'build'
        workingDir = projectDir
        environment 'ANDROID_HOME', (sdkRoot ?: '')
        environment 'ANDROID_SDK_ROOT', (sdkRoot ?: '')
        commandLine './gradlew', 'clean', 'deploy',
                "-PmindustryVersion=${t.version}",
                "-PgameBuild=${t.build}",
                '--no-daemon'
    }
}

tasks.register('deployAll') {
    group = 'build'
    dependsOn targets.collect { "deploy${it.name}" }
}
